name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Test on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghostscript poppler-utils
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript poppler
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ghostscript --yes --no-progress

          $popplerVersion = "26.02.0-0"
          $popplerArchive = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion.zip"
          $popplerDirectory = Join-Path $env:RUNNER_TEMP "poppler-$popplerVersion"
          $popplerUrl = "https://github.com/oschwartz10612/poppler-windows/releases/download/v$popplerVersion/Release-$popplerVersion.zip"
          $expectedHash = "993E4A94376ED712FAFC7058D724EA0B943D118BBD2305CD9ED55174EB85CDA5"

          Invoke-WebRequest $popplerUrl -OutFile $popplerArchive
          $actualHash = (Get-FileHash $popplerArchive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Poppler archive checksum mismatch"
          }
          Expand-Archive $popplerArchive -DestinationPath $popplerDirectory

          $ghostscript = Get-ChildItem "$env:ProgramFiles\gs" -Filter gswin64c.exe -Recurse -File |
            Sort-Object FullName |
            Select-Object -Last 1
          $pdftocairo = Get-ChildItem $popplerDirectory -Filter pdftocairo.exe -Recurse -File |
            Sort-Object FullName |
            Select-Object -Last 1
          $pdfinfo = Get-ChildItem $popplerDirectory -Filter pdfinfo.exe -Recurse -File |
            Sort-Object FullName |
            Select-Object -Last 1

          if (-not $ghostscript -or -not $pdftocairo -or -not $pdfinfo) {
            throw "Ghostscript or Poppler executables were not installed"
          }

          $nativeDirectories = @(
            $ghostscript.DirectoryName
            $pdftocairo.DirectoryName
          ) | Select-Object -Unique

          foreach ($directory in $nativeDirectories) {
            $directory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "$directory;$env:Path"
          }

          & $ghostscript.FullName -version
          if ($LASTEXITCODE -ne 0) { throw "Ghostscript failed to start" }
          & $pdftocairo.FullName -v
          if ($LASTEXITCODE -ne 0) { throw "pdftocairo failed to start" }
          & $pdfinfo.FullName -v
          if ($LASTEXITCODE -ne 0) { throw "pdfinfo failed to start" }
      - name: Run unit tests
        run: yarn test:unit
      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:integration
      - name: Run integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: yarn test:integration
