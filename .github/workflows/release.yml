name: Build & Publish Extension

on:
    push:
        branches: ["main", "master"]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        name: Build and package
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: Enable Corepack
              run: corepack enable
            - name: Locate Yarn cache
              id: yarn-cache
              run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
            - name: Cache Yarn packages
              uses: actions/cache@v5
              with:
                  path: ${{ steps.yarn-cache.outputs.path }}
                  key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      yarn-${{ runner.os }}-
            - name: Install dependencies
              run: |
                  npm install --global @vscode/vsce@3.9.2 ovsx@1.1.1
                  yarn install --immutable
            - name: Install native dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes ghostscript poppler-utils
            - name: Get package version
              id: package-version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "current-version=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Run Tests
              run: xvfb-run -a yarn test
            - name: Check if version exists
              id: check-version
              env:
                  VERSION: ${{ steps.package-version.outputs.current-version }}
              run: |
                  echo "Checking version $VERSION..."
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                  
                  # Check VS Marketplace
                  VS_Response=$(curl -s --location 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
                    --header 'Accept: application/json; api-version=7.2-preview.1' \
                    --header 'Content-Type: application/json' \
                    --data '{
                        "filters": [
                            {
                                "criteria": [
                                    {
                                        "filterType": 7,
                                        "value": "ahnafnafee.postscript-preview"
                                    }
                                ]
                            }
                        ],
                        "flags": 915
                    }')
                  
                  # Check if version exists (robust jq boolean)
                  if echo "$VS_Response" | jq -e --arg v "$VERSION" '.results[0].extensions[0].versions | map(select(.version == $v)) | length > 0' > /dev/null; then
                    echo "Version $VERSION already exists in VS Marketplace."
                    echo "VS_EXISTS=true" >> "$GITHUB_ENV"
                  else
                    echo "Version $VERSION not found in VS Marketplace."
                    echo "VS_EXISTS=false" >> "$GITHUB_ENV"
                  fi

                  # Check Open VSX
                  OVSX_Status=$(curl -o /dev/null -s -w "%{http_code}" https://open-vsx.org/api/ahnafnafee/postscript-preview/$VERSION)
                  
                  if [ "$OVSX_Status" = "200" ]; then
                    echo "Version $VERSION already exists in Open VSX."
                    echo "OVSX_EXISTS=true" >> "$GITHUB_ENV"
                  else
                    echo "Version $VERSION not found in Open VSX."
                    echo "OVSX_EXISTS=false" >> "$GITHUB_ENV"
                  fi

            - name: Validate Version Status
              run: |
                  if [ "$VS_EXISTS" = "true" ] && [ "$OVSX_EXISTS" = "true" ]; then
                    echo "::warning::Version $VERSION is already published to both VS Marketplace and Open VSX. Skipping publish."
                    echo "Please bump the version in package.json to release a new version."
                  fi

            - name: Build extension
              if: env.VS_EXISTS == 'false' || env.OVSX_EXISTS == 'false'
              run: vsce package --no-dependencies -o postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix
            - name: Build Open VSX extension
              if: env.OVSX_EXISTS == 'false'
              run: |
                  cp package.json "$RUNNER_TEMP/postscript-preview-package.json"
                  trap 'cp "$RUNNER_TEMP/postscript-preview-package.json" package.json' EXIT
                  node scripts/prepare-open-vsx-manifest.mjs package.json
                  vsce package --no-dependencies -o postscript-preview-${{ steps.package-version.outputs.current-version }}-open-vsx.vsix
            - name: Validate registry packages
              if: env.OVSX_EXISTS == 'false'
              run: |
                  unzip -p postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix extension/package.json |
                    jq -e '.extensionDependencies | index("mxschmitt.postscript") != null'
                  unzip -p postscript-preview-${{ steps.package-version.outputs.current-version }}-open-vsx.vsix extension/package.json |
                    jq -e '(.extensionDependencies // []) | index("mxschmitt.postscript") == null'
                  if unzip -p postscript-preview-${{ steps.package-version.outputs.current-version }}-open-vsx.vsix extension.vsixmanifest |
                    grep --fixed-strings --quiet 'mxschmitt.postscript'; then
                      echo "Open VSX package still declares the unavailable dependency" >&2
                      exit 1
                  fi
            - name: Upload a Build Artifact
              if: env.VS_EXISTS == 'false' || env.OVSX_EXISTS == 'false'
              uses: actions/upload-artifact@v7
              with:
                  name: postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix
                  path: postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix
                  if-no-files-found: error
            - name: Extract Changelog
              if: (env.VS_EXISTS == 'false' || env.OVSX_EXISTS == 'false') && success()
              run: |
                  awk -v v="[${{ steps.package-version.outputs.current-version }}]" '
                  /^## / {
                      if (index($0, v)) {
                      p=1
                      next
                      } else {
                      p=0
                      }
                  }
                  p { print }
                  ' CHANGELOG.md > RELEASE_BODY.md
            - name: Create release with artifact
              if: (env.VS_EXISTS == 'false' || env.OVSX_EXISTS == 'false') && success()
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.github_token }}
              with:
                  name: Release v${{ steps.package-version.outputs.current-version }}
                  tag_name: v${{ steps.package-version.outputs.current-version }}
                  draft: false
                  body_path: RELEASE_BODY.md
                  files: postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix
            - name: Publish to Open VSX Registry
              if: env.OVSX_EXISTS == 'false'
              env:
                  OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
              run: ovsx publish "postscript-preview-${{ steps.package-version.outputs.current-version }}-open-vsx.vsix" --pat "$OVSX_PAT"
            - name: Publish to Visual Studio Marketplace
              if: env.VS_EXISTS == 'false'
              env:
                  VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
              run: vsce publish --no-dependencies --packagePath "postscript-preview-${{ steps.package-version.outputs.current-version }}.vsix"
